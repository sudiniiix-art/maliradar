ansform:translateX(-50%);font-size:clamp(28px,7vw,60px);font-weight:1000;color:#fff0a1;text-shadow:0 0 25px #ffca32;animation:cash 1s both 1.8s}.btn{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:999px;border:1px solid #ffd84a;background:#160f02;color:#fff;font-weight:900}@keyframes t{50%{transform:scale(1.25)}}@keyframes g{to{transform:translateX(100%)}}@keyframes r{50%{transform:translate(-50%,-50%) rotateX(67deg) scale(1.25);opacity:1}}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.05) rotate(-25deg);opacity:0}65%{transform:translate(-50%,-50%) scale(1.18);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes slam{0%{opacity:0;transform:translateY(70px) scale(1.8);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes cash{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}</style></head><body><div class="s"><div class="t"></div><div class="g"></div><div class="r"></div><div class="r r2"></div><div class="core">🥇</div><div class="tx"><div class="p">1ST</div><div class="ttl">CHAMPION</div><div class="u">MALIRADAR WINNER</div></div><div class="cash">KSh 50,000</div><button class="btn" onclick="location.reload()">REPLAY</button></div></body></html>
