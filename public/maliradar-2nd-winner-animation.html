px;animation:grid 1.4s linear infinite;opacity:.6}@keyframes grid{to{background-position:0 45px,45px 0}}.tunnel{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7vw,rgba(255,255,255,.08) 7.1vw 7.3vw);animation:tun 1.8s ease-in-out infinite;opacity:.45}@keyframes tun{50%{transform:scaleX(1.3);opacity:.9}}.burst{position:absolute;left:50%;top:43%;width:180vw;height:180vw;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,transparent 0 6deg,rgba(255,255,255,.06) 7deg 9deg,transparent 10deg 18deg);animation:burst 6s linear infinite}@keyframes burst{to{transform:translate(-50%,-50%) rotate(360deg)}}.smoke{position:absolute;left:-10%;right:-10%;bottom:0;height:43%;background:radial-gradient(ellipse at 20% 100%,rgba(255,255,255,.25),transparent 40%),radial-gradient(ellipse at 70% 100%,rgba(255,255,255,.2),transparent 42%);filter:blur(10px);animation:smoke 2.6s ease-in-out infinite alternate}@keyframes smoke{to{transform:translateY(-20px) scale(1.08)}}.glitch{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.045) 9px 10px);mix-blend-mode:screen;animation:glitch .22s steps(2) infinite}@keyframes glitch{50%{transform:translate(4px,-2px)}}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;animation:flash .35s both 1.25s}@keyframes flash{15%{opacity:.9}100%{opacity:0}}.rev{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;width:100%;z-index:30}.logo{font-size:18px;letter-spacing:.5em;color:var(--a);font-weight:900;opacity:0;animation:up .5s both 1.7s}.place{font-size:clamp(80px,20vw,190px);font-weight:1000;line-height:.75;background:linear-gradient(#fff,var(--a),#5a3200);-webkit-background-clip:text;color:transparent;opacity:0;animation:slam .7s both 2s}.badge{font-size:clamp(18px,4vw,32px);font-weight:1000;letter-spacing:.25em;margin-top:18px;opacity:0;animation:up .5s both 2.55s}.name{font-size:14px;letter-spacing:.28em;color:#c9d5df;margin-top:8px;opacity:0;animation:up .5s both 2.8s}.prize{font-size:clamp(22px,5vw,46px);font-weight:1000;margin-top:22px;opacity:0;animation:cash .75s both 3.1s}@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(2.1);filter:blur(16px)}65%{opacity:1;transform:translate(-50%,-50%) scale(.92);filter:none}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes up{to{opacity:1;transform:none}}@keyframes cash{0%{opacity:0;transform:scale(.4) translateY(40px)}65%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}button{position:absolute;z-index:40;bottom:4%;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:900}.gold{--a:#ffd84a}.silver{--a:#bcecff}.bronze{--a:#ff9b68}.gold{background:radial-gradient(ellipse at 50% 42%,#584316 0,#100c04 43%,#010101 78%)}.silver{background:radial-gradient(ellipse at 50% 42%,#24465a 0,#061019 43%,#010205 78%)}.bronze{background:radial-gradient(ellipse at 50% 42%,#5a2918 0,#120603 43%,#010101 78%)}</style></head><body><div class="s silver"><div class="stad"></div><div class="lights"></div><div class="tunnel"></div><div class="burst"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="platform"></div><div class="grid"></div><div class="smoke"></div><div class="glitch"></div><div class="flash"></div><div class="rev"><div class="logo">MALIRADAR</div><div class="place">2ND</div><div class="badge">ELITE RUNNER-UP</div><div class="name">SHAMSUDIN</div><div class="prize">KSh 25,000</div></div><button onclick="location.reload()">REPLAY</button></div></body></html>
